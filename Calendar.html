<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="RRHS Band Calendar - Month/Week/Agenda views">
	<link rel="icon" href="Media/Photos/SchoolLogo/RoyalSoundLogo.png" />
	<link rel="stylesheet" href="Css/main.css">
	<title>Calendar — RRHS Band</title>
</head>
<body>
	<header>
		<div class="logo-area">
			<a href="index.html" aria-label="RRHS Band Home"><img src="Media/Photos/SchoolLogo/RoyalSoundLogo.png" alt="Band Logo" class="logo" /></a>
			<h1>RRHS Band</h1>
		</div>
		<nav aria-label="Primary Navigation">
			<a href="index.html" class="nav-link">Home</a>
			<a href="About.html" class="nav-link">About</a>
			<a href="Calendar.html" class="nav-link active">Calendar</a>
			<a href="Sponsors.html" class="nav-link">Sponsors</a>
			<a href="Volunteer.html" class="nav-link">Volunteer</a>
		</nav>
		<button class="mobile-menu-toggle" aria-label="Toggle navigation">
			<span></span>
			<span></span>
			<span></span>
		</button>
	</header>

	<main style="padding-top:120px;">
		<section class="container info">
			<div class="section-header">
				<h2>Upcoming Events</h2>
				<div class="section-divider"></div>
			</div>
			<!-- Calendar viewpoint: Month / Week / Agenda -->
			<div class="calendar-views" style="text-align:center; margin:18px 0;">
				<a href="#month" class="view-link">Month</a>
				<a href="#week" class="view-link">Week</a>
				<a href="#agenda" class="view-link">Agenda</a>
				<a class="view-link" href="https://calendar.google.com/calendar/u/0?cid=46ae711cbae446a68ba43ebf86782fb89f22a534cae43e802fb0ac8c890fc46f%40group.calendar.google.com" target="_blank" rel="noopener">Open full Google Calendar</a>
			</div>

			<div class="calendar-frames" style="max-width:1100px; margin:0 auto;">
				<div id="month" class="calendar-frame">
					<iframe src="https://calendar.google.com/calendar/embed?src=46ae711cbae446a68ba43ebf86782fb89f22a534cae43e802fb0ac8c890fc46f%40group.calendar.google.com&ctz=America%2FNew_York&mode=MONTH" style="border:0" width="100%" height="700" frameborder="0" scrolling="no" loading="lazy" title="RRHS Band - Month view"></iframe>
				</div>
				<div id="week" class="calendar-frame">
					<iframe src="https://calendar.google.com/calendar/embed?src=46ae711cbae446a68ba43ebf86782fb89f22a534cae43e802fb0ac8c890fc46f%40group.calendar.google.com&ctz=America%2FNew_York&mode=WEEK" style="border:0" width="100%" height="700" frameborder="0" scrolling="no" loading="lazy" title="RRHS Band - Week view"></iframe>
				</div>
				<div id="agenda" class="calendar-frame">
					<iframe src="https://calendar.google.com/calendar/embed?src=46ae711cbae446a68ba43ebf86782fb89f22a534cae43e802fb0ac8c890fc46f%40group.calendar.google.com&ctz=America%2FNew_York&mode=AGENDA" style="border:0" width="100%" height="700" frameborder="0" scrolling="no" loading="lazy" title="RRHS Band - Agenda view"></iframe>
				</div>
				<noscript>
					<p style="text-align:center; color:#ccc;">Your browser does not support JavaScript or it is disabled. You can view the calendar directly: <a href="https://calendar.google.com/calendar/u/0?cid=46ae711cbae446a68ba43ebf86782fb89f22a534cae43e802fb0ac8c890fc46f%40group.calendar.google.com" target="_blank" rel="noopener">Open Google Calendar</a></p>
				</noscript>
			</div>
		</section>
	</main>

	<style>
		.calendar-views .view-link{display:inline-block; margin:0 6px; padding:8px 12px; background:#f2f2f2; border-radius:6px; color:#111; text-decoration:none; font-weight:600}
		.calendar-frames{position:relative}
		.calendar-frame{display:none}
		#month{display:block}
		@media (max-width:700px){ .calendar-frames iframe{height:520px} }
	</style>

	<script>
		function showCalendarView(){
			var hash = (location.hash || '#month').replace('#','');
			['month','week','agenda'].forEach(function(id){
				var el = document.getElementById(id);
				if(!el) return;
				el.style.display = (id === hash) ? 'block' : 'none';
			});
		}
		window.addEventListener('hashchange', showCalendarView, false);
		window.addEventListener('load', showCalendarView, false);
	</script>

</body>
</html>
